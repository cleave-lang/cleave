name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build
        run: make -C compiler

      - name: Verify binary
        run: |
          out=$(./compiler/build/cleavec --version)
          echo "stdout: $out"
          echo "$out" | grep -q "cleavec 0.0.1" || { echo "version output unexpected"; exit 1; }

      - name: Test
        run: make -C compiler test

      - name: Bench
        run: make -C compiler bench
