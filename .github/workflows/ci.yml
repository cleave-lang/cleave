name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build
        run: make -C compiler

      - name: Verify binary
        run: |
          out=$(./compiler/build/cleavec --version)
          echo "stdout: $out"
          echo "$out" | grep -q "cleavec 0.3.0" || { echo "version output unexpected"; exit 1; }

      - name: Test
        run: make -C compiler test

      - name: Bench
        run: make -C compiler bench

  runtime:
    name: Runtime · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The runtime integration test invokes the cleavec binary; we need
    # the C compiler built first. Building it inline here keeps the job
    # standalone instead of depending on `compiler:`.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build cleavec
        run: make -C compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('runtime/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build runtime
        working-directory: runtime
        run: cargo build --release

      - name: Test runtime
        working-directory: runtime
        run: cargo test --release

      - name: Bench runtime
        working-directory: runtime
        run: cargo run --release --bin cleave-runtime-bench
